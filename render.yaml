# Free Harborlight demo deployment.
# SQLite data is temporary and will reset after service restarts.

services:
  - type: web
    name: harborlight
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HARBORLIGHT_DATA_DIR
        value: /app/var
      - key: HARBORLIGHT_USERNAME
        value: judge
      - key: HARBORLIGHT_PASSWORD
        value: ""
      - key: HARBORLIGHT_SEED_DEMO
        value: "1"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
